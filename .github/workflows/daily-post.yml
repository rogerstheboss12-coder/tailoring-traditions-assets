name: Keep Buffer queue loaded (7am + 5pm CT)
on:
  schedule:
    - cron: "17 */6 * * *"   # timing doesn't matter; Buffer posts at the exact slots
  workflow_dispatch:
concurrency: daily-post
permissions:
  contents: write
jobs:
  topup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            posts.json
            scheduler
          sparse-checkout-cone-mode: false
      - run: python scheduler/topup.py
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
      - run: |
          git config user.name "ttc-scheduler"
          git config user.email "ttc-scheduler@users.noreply.github.com"
          git add scheduler/state.json
          git diff --cached --quiet || { git commit -m "Top up Buffer queue" && git push; }
