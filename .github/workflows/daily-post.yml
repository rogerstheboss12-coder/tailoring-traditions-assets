name: Instagram posts (7am + 5pm CT)
on:
  schedule:
    - cron: "0 12,13,22,23 * * *"   # covers 7am/5pm Central in both CDT and CST; script picks the right one
  workflow_dispatch:
concurrency: daily-post
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            posts.json
            scheduler
          sparse-checkout-cone-mode: false
      - run: python scheduler/post_next.py
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
      - run: |
          git config user.name "ttc-scheduler"
          git config user.email "ttc-scheduler@users.noreply.github.com"
          git add scheduler/state.json
          git commit -m "Log daily post" && git push
